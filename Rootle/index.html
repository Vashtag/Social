<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Anatomy Rootle</title>
  <meta name="description" content="Use every root tile to build the four medical terms. A new puzzle every day." />
  <meta property="og:title" content="Anatomy Rootle" />
  <meta property="og:description" content="A grid of Greek and Latin roots — use them all to build four anatomy terms. Learn the anatomy of words. A new puzzle every day." />
  <meta property="og:type" content="website" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      color-scheme: dark;
      --bg: #0d0d0d;
      --surface: #161616;
      --surface-2: #1d1d1d;
      --border: #2a2a2a;
      --text: #f0ece4;
      --muted: #777;
      --root: #9a5fd0;
      --danger: #c95454;
      --c0: #b59f3b;
      --c1: #4a934a;
      --c2: #4a7fd6;
      --c3: #9a5fd0;
    }
    html, body {
      min-height: 100%; width: 100%; max-width: 100%; overflow-x: hidden;
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
      -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%; text-size-adjust: 100%;
      text-rendering: optimizeLegibility;
    }
    body {
      min-height: 100dvh; display: flex; justify-content: center;
      padding: 1.25rem 1rem calc(1.5rem + env(safe-area-inset-bottom)); touch-action: manipulation;
    }
    .wrap { width: 100%; max-width: 540px; display: flex; flex-direction: column; min-height: calc(100dvh - 2.75rem); }

    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0.25rem 0.1rem 1.1rem; border-bottom: 1px solid var(--border); margin-bottom: 1rem;
    }
    .brand { display: flex; flex-direction: column; gap: 0.25rem; }
    .brand-title { font-size: 1.5rem; font-weight: 800; letter-spacing: -0.02em; }
    .brand-sub { font-size: 0.6rem; letter-spacing: 0.32em; text-transform: uppercase; color: var(--muted); }
    .back-link {
      font-size: 0.7rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--muted);
      text-decoration: none; border: 1px solid var(--border); border-radius: 999px;
      padding: 0.5rem 0.9rem; transition: all 0.15s; white-space: nowrap;
    }
    .back-link:hover { color: var(--text); border-color: #3a3a3a; }

    .daystrip { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 0.7rem; }
    .day-label, .day-num { font-size: 0.62rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); }
    .day-num { color: var(--text); font-weight: 700; cursor: pointer; user-select: none; -webkit-user-select: none; }

    .instructions { text-align: center; color: var(--muted); font-size: 0.72rem; line-height: 1.4; margin-bottom: 0.8rem; }
    .instructions b { color: var(--text); font-weight: 700; }

    /* ── Clue rows (the four terms being built) ── */
    .clues { display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 1rem; }
    .clue {
      border: 1px solid var(--border); border-radius: 11px; background: var(--surface);
      padding: 0.5rem 0.7rem; cursor: pointer; transition: border-color 0.15s, background 0.15s;
    }
    .clue.focus { border-color: var(--root); background: #191320; }
    .clue.solved { cursor: default; border-style: solid; }
    .clue.solved.c0 { background: rgba(181,159,59,0.16); border-color: var(--c0); }
    .clue.solved.c1 { background: rgba(74,147,74,0.16);  border-color: var(--c1); }
    .clue.solved.c2 { background: rgba(74,127,214,0.16); border-color: var(--c2); }
    .clue.solved.c3 { background: rgba(154,95,208,0.16); border-color: var(--c3); }
    body.shake .clue.focus { animation: shake 0.4s; border-color: var(--danger); }
    @keyframes shake {
      10%, 90% { transform: translateX(-2px); } 20%, 80% { transform: translateX(3px); }
      30%, 50%, 70% { transform: translateX(-6px); } 40%, 60% { transform: translateX(6px); }
    }

    .clue-def { font-size: 0.78rem; font-weight: 600; line-height: 1.3; color: #cdc7bd; }
    .clue-slots { display: flex; flex-wrap: wrap; gap: 0.3rem; margin-top: 0.4rem; align-items: center; }
    .slot-empty {
      width: 30px; height: 26px; border: 1.5px dashed var(--border); border-radius: 7px; flex: 0 0 auto;
    }
    .placed {
      display: inline-flex; align-items: center; background: rgba(154,95,208,0.16);
      border: 1px solid var(--root); border-radius: 8px; padding: 0.28rem 0.55rem;
      font-size: 0.92rem; font-weight: 800; cursor: pointer;
    }
    .clue.solved .placed { background: transparent; border-color: transparent; padding: 0.28rem 0.35rem; cursor: default; }
    .clue.solved .plus { color: var(--muted); font-weight: 400; font-size: 0.85rem; }
    .solved-term { font-size: 1.02rem; font-weight: 800; letter-spacing: -0.01em; }
    .solved-mean { font-size: 0.72rem; color: var(--muted); margin-top: 0.3rem; }
    .solved-mean b { color: var(--text); }

    /* ── Tile grid ── */
    .grid {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.5rem; margin-bottom: 0.9rem;
    }
    .tile {
      display: flex; align-items: center; justify-content: center;
      background: var(--surface-2); border: 1px solid var(--border); border-radius: 13px;
      padding: 0.5rem 0.3rem; cursor: pointer; min-height: 78px;
      transition: transform 0.1s, border-color 0.15s, background 0.15s, color 0.15s;
      user-select: none; -webkit-user-select: none;
    }
    .tile:hover { border-color: #3a3a3a; }
    .tile:active { transform: scale(0.95); }
    /* Picked — tile stays in the grid but takes on its clue's colour */
    .tile.picked.c0 { border-color: var(--c0); background: rgba(181,159,59,0.16); color: var(--c0); }
    .tile.picked.c1 { border-color: var(--c1); background: rgba(74,147,74,0.16);  color: #6cc06c; }
    .tile.picked.c2 { border-color: var(--c2); background: rgba(74,127,214,0.16); color: #7aa6e6; }
    .tile.picked.c3 { border-color: var(--c3); background: rgba(154,95,208,0.16); color: #b98fe0; }
    .tile.locked { color: #0d0d0d; cursor: default; }
    .tile.locked.c0 { background: var(--c0); border-color: var(--c0); }
    .tile.locked.c1 { background: var(--c1); border-color: var(--c1); }
    .tile.locked.c2 { background: var(--c2); border-color: var(--c2); }
    .tile.locked.c3 { background: var(--c3); border-color: var(--c3); }
    .tile-frag { font-size: 1.3rem; font-weight: 800; letter-spacing: -0.01em; text-align: center; word-break: break-word; }

    .status { display: flex; align-items: center; justify-content: center; gap: 0.9rem; margin-bottom: 0.5rem; min-height: 1.4rem; }
    .mistakes { display: flex; align-items: center; gap: 0.4rem; font-size: 0.68rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--danger); }
    .dot.spent { background: var(--border); }

    .controls { display: flex; justify-content: center; gap: 0.6rem; margin-top: auto; }
    .ghost-btn {
      background: transparent; color: var(--muted); border: 1px solid var(--border); border-radius: 999px;
      padding: 0.55rem 1.2rem; font-size: 0.7rem; font-weight: 700; letter-spacing: 0.08em;
      text-transform: uppercase; cursor: pointer; transition: all 0.15s;
    }
    .ghost-btn:hover { color: var(--text); border-color: #3a3a3a; }
    .ghost-btn.hidden { display: none; }

    /* ── End panel ── */
    .end { display: none; flex-direction: column; align-items: center; gap: 0.8rem; text-align: center; margin-top: 1rem; }
    .end.show { display: flex; }
    .end-title { font-size: 1.4rem; font-weight: 800; letter-spacing: -0.01em; }
    .end-sub { color: var(--muted); font-size: 0.9rem; line-height: 1.4; }
    .end-sub b { color: var(--text); }
    .end-actions { display: flex; gap: 0.6rem; width: 100%; }
    .btn {
      flex: 1; background: transparent; color: var(--text); border: 1px solid #3a3a3a; border-radius: 999px;
      padding: 0.85rem 0.5rem; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.04em;
      text-transform: uppercase; cursor: pointer; transition: all 0.15s;
    }
    .btn:hover:not(:disabled) { background: rgba(255,255,255,0.06); }
    .btn:active:not(:disabled) { transform: scale(0.98); }
    .btn-submit { background: var(--text); color: var(--bg); border-color: var(--text); }
    .btn-submit:hover { background: #fff; }
    .text-share {
      background: none; border: none; color: var(--muted); font-size: 0.72rem; letter-spacing: 0.05em;
      text-decoration: underline; text-underline-offset: 3px; cursor: pointer; padding: 0.2rem;
    }
    .text-share:hover { color: var(--text); }

    .toast {
      position: fixed; left: 50%; bottom: 2rem; transform: translateX(-50%) translateY(20px);
      background: var(--text); color: var(--bg); padding: 0.7rem 1.2rem; border-radius: 999px;
      font-size: 0.8rem; font-weight: 700; opacity: 0; pointer-events: none; transition: all 0.25s;
      z-index: 50; white-space: nowrap;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ── Selfie camera + preview ── */
    .cam-modal, .cam-preview {
      position: fixed; inset: 0; z-index: 100; background: #000;
      display: none; flex-direction: column; align-items: center; justify-content: center;
    }
    .cam-modal.show, .cam-preview.show { display: flex; }
    #cam-video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; transform: scaleX(-1); }
    .cam-ui {
      position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
      justify-content: flex-end; gap: 1.1rem; padding: 1.5rem 1.25rem calc(2.2rem + env(safe-area-inset-bottom));
    }
    .cam-hint { max-width: 320px; text-align: center; color: rgba(255,255,255,0.82); font-size: 0.78rem; line-height: 1.4; text-shadow: 0 1px 6px rgba(0,0,0,0.6); }
    .cam-shutter { width: 74px; height: 74px; border-radius: 50%; background: #fff; border: 5px solid rgba(255,255,255,0.45); cursor: pointer; transition: transform 0.1s; }
    .cam-shutter:active { transform: scale(0.92); }
    .cam-close {
      background: rgba(0,0,0,0.35); border: 1px solid rgba(255,255,255,0.25); color: #fff; border-radius: 999px;
      padding: 0.55rem 1.4rem; font-size: 0.78rem; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; cursor: pointer;
    }
    .cam-preview { gap: 1rem; padding: 1.25rem 1.25rem calc(1.5rem + env(safe-area-inset-bottom)); justify-content: center; }
    #cam-img { max-width: 100%; max-height: 68vh; border-radius: 16px; border: 1px solid rgba(255,255,255,0.12); }
    .cam-preview-actions { display: flex; gap: 0.6rem; width: 100%; max-width: 420px; }
    .cam-preview-actions .btn { flex: 1; display: grid; place-items: center; text-decoration: none; }

    footer { margin-top: 1.2rem; text-align: center; font-size: 0.62rem; letter-spacing: 0.15em; text-transform: uppercase; color: #333; }
  </style>
  <script data-goatcounter="https://vashtags.goatcounter.com/count"
          async src="//gc.zgo.at/count.js"></script>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">
        <div class="brand-title">Rootle</div>
        <div class="brand-sub">Anatomy Edition</div>
      </div>
      <a class="back-link" href="../">← Games</a>
    </header>

    <div class="daystrip">
      <span class="day-label" id="day-date">Puzzle of the day</span>
      <span class="day-num" id="day-num"></span>
    </div>

    <div class="instructions">
      Use <b>every</b> root tile to build all four terms. Pick a clue, then tap roots in order.
    </div>

    <div class="clues" id="clues"></div>

    <div class="grid" id="grid" aria-label="Root fragments"></div>

    <div class="status">
      <div class="mistakes" id="mistakes"></div>
    </div>

    <div class="controls">
      <button class="ghost-btn" id="clear">Clear clue</button>
    </div>

    <div class="end" id="end">
      <div class="end-title" id="end-title"></div>
      <div class="end-sub" id="end-sub"></div>
      <div class="end-actions">
        <button class="btn btn-submit" id="share">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align:-3px;margin-right:0.4rem;">
            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
            <circle cx="12" cy="13" r="4"/>
          </svg>Share result
        </button>
        <a class="btn" id="home-link" href="../" style="display:grid;place-items:center;text-decoration:none;">More games</a>
      </div>
      <button class="text-share" id="copy-text">or copy text result</button>
    </div>

    <footer>vashtag · social games</footer>
  </div>

  <!-- Selfie camera -->
  <div class="cam-modal" id="cam-modal">
    <video id="cam-video" autoplay playsinline muted></video>
    <div class="cam-ui">
      <div class="cam-hint">Line up your selfie — your result gets added to the photo.</div>
      <button class="cam-shutter" id="cam-shutter" aria-label="Take photo"></button>
      <button class="cam-close" id="cam-close">Cancel</button>
    </div>
  </div>

  <div class="cam-preview" id="cam-preview">
    <img id="cam-img" alt="Your Rootle result" />
    <div class="cam-preview-actions">
      <button class="btn btn-submit" id="cam-share-img">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align:-3px;margin-right:0.35rem;">
          <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/>
        </svg>Share to story
      </button>
      <button class="btn" id="cam-download">Save photo</button>
    </div>
    <button class="cam-close" id="cam-preview-close">Done</button>
    <div class="cam-hint">Tap “Share to story”, then choose Instagram → Stories.</div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
  /* ==========================================================================
     ANATOMY ROOTLE — a Connections-style root puzzle. Every day you get a grid
     of Greek/Latin root fragments and four clues. Use ALL the tiles to build
     the four medical terms — pick a clue, then tap its roots in order. Each tile
     shows what the root means, so solving teaches how the vocabulary is built.
     Four wrong groups ends the game (like Connections' four mistakes).
     ========================================================================== */
  // Each daily puzzle = a theme + four terms. `roots` is the ordered list of
  // [fragment, meaning] pairs that spell the term.
  const PUZZLES = [
    { theme: "Surgical repair (-plasty)", terms: [
      { def: "Reshaping the nose", roots: [["rhino","nose"],["plasty","surgical repair"]] },
      { def: "Repair of a blood vessel", roots: [["angio","vessel"],["plasty","surgical repair"]] },
      { def: "Rebuilding a joint", roots: [["arthro","joint"],["plasty","surgical repair"]] },
      { def: "Reshaping the breast", roots: [["mammo","breast"],["plasty","surgical repair"]] },
    ]},
    { theme: "Flow & discharge (-rrhea)", terms: [
      { def: "Watery, frequent stools", roots: [["dia","through"],["rrhea","flow"]] },
      { def: "A runny nose", roots: [["rhino","nose"],["rrhea","flow"]] },
      { def: "Discharge from the ear", roots: [["oto","ear"],["rrhea","flow"]] },
      { def: "Discharge of pus", roots: [["pyo","pus"],["rrhea","flow"]] },
    ]},
    { theme: "Surgical openings (-stomy)", terms: [
      { def: "An opening into the colon", roots: [["colo","colon"],["stomy","opening"]] },
      { def: "An opening into the windpipe", roots: [["tracheo","windpipe"],["stomy","opening"]] },
      { def: "An opening into the stomach", roots: [["gastro","stomach"],["stomy","opening"]] },
      { def: "An opening into the bladder", roots: [["cysto","bladder"],["stomy","opening"]] },
    ]},
    { theme: "Deficiencies (-penia)", terms: [
      { def: "Too few white blood cells", roots: [["leuko","white cells"],["penia","deficiency"]] },
      { def: "Reduced bone density", roots: [["osteo","bone"],["penia","deficiency"]] },
      { def: "Too few neutrophils", roots: [["neutro","neutrophil"],["penia","deficiency"]] },
      { def: "Age-related muscle loss", roots: [["sarco","muscle"],["penia","deficiency"]] },
    ]},
    { theme: "Blood conditions (-emia)", terms: [
      { def: "Too few red blood cells", roots: [["an","without"],["emia","blood"]] },
      { def: "Cancer of the blood", roots: [["leuk","white"],["emia","blood"]] },
      { def: "Waste products in the blood", roots: [["ur","urine"],["emia","blood"]] },
      { def: "Restricted blood supply", roots: [["isch","hold back"],["emia","blood"]] },
    ]},
    { theme: "Resembling (-oid)", terms: [
      { def: "Triangular shoulder muscle", roots: [["delt","triangle"],["oid","resembling"]] },
      { def: "S-shaped part of the colon", roots: [["sigm","S-shape"],["oid","resembling"]] },
      { def: "Shield-shaped neck gland", roots: [["thyr","shield"],["oid","resembling"]] },
      { def: "Breast-shaped skull process", roots: [["mast","breast"],["oid","resembling"]] },
    ]},
    { theme: "Hernia & swelling (-cele)", terms: [
      { def: "A fluid-filled scrotal swelling", roots: [["hydro","water"],["cele","swelling"]] },
      { def: "Bladder bulging into the vagina", roots: [["cysto","bladder"],["cele","hernia"]] },
      { def: "Rectum bulging into the vagina", roots: [["recto","rectum"],["cele","hernia"]] },
      { def: "A swelling of scrotal veins", roots: [["varico","varicose vein"],["cele","swelling"]] },
    ]},
    { theme: "Growth & wasting (-trophy)", terms: [
      { def: "Wasting away of tissue", roots: [["a","without"],["trophy","growth"]] },
      { def: "Overgrowth of a tissue", roots: [["hyper","excessive"],["trophy","growth"]] },
      { def: "Faulty muscle development", roots: [["dys","faulty"],["trophy","growth"]] },
      { def: "Underdevelopment of a tissue", roots: [["hypo","under"],["trophy","growth"]] },
    ]},
    { theme: "Surgical puncture (-centesis)", terms: [
      { def: "Draining fluid from the chest", roots: [["thora","chest"],["centesis","puncture"]] },
      { def: "Tapping fluid from a joint", roots: [["arthro","joint"],["centesis","puncture"]] },
      { def: "Sampling amniotic fluid", roots: [["amnio","amniotic sac"],["centesis","puncture"]] },
      { def: "Draining fluid from the abdomen", roots: [["para","beside"],["centesis","puncture"]] },
    ]},
    { theme: "Urine conditions (-uria)", terms: [
      { def: "Blood in the urine", roots: [["hemat","blood"],["uria","urine"]] },
      { def: "Painful urination", roots: [["dys","painful"],["uria","urine"]] },
      { def: "Excessive urine output", roots: [["poly","much"],["uria","urine"]] },
      { def: "Little or no urine", roots: [["an","without"],["uria","urine"]] },
    ]},
    { theme: "Eating & swallowing (-phagia)", terms: [
      { def: "Difficulty swallowing", roots: [["dys","difficult"],["phagia","swallowing"]] },
      { def: "Inability to swallow", roots: [["a","without"],["phagia","swallowing"]] },
      { def: "Excessive hunger", roots: [["poly","excessive"],["phagia","eating"]] },
      { def: "Swallowing of air", roots: [["aero","air"],["phagia","swallowing"]] },
    ]},
    { theme: "Disease of an organ (-pathy)", terms: [
      { def: "Disease of the kidney", roots: [["nephro","kidney"],["pathy","disease"]] },
      { def: "Disease of a joint", roots: [["arthro","joint"],["pathy","disease"]] },
      { def: "Disease of the retina", roots: [["retino","retina"],["pathy","disease"]] },
      { def: "Disease of the spinal cord", roots: [["myelo","spinal cord"],["pathy","disease"]] },
    ]},
    { theme: "Inflammations (-itis)", terms: [
      { def: "Inflammation of the liver",   roots: [["hepat","liver"],["itis","inflammation"]] },
      { def: "Inflammation of a joint",     roots: [["arthr","joint"],["itis","inflammation"]] },
      { def: "Inflammation of the stomach", roots: [["gastr","stomach"],["itis","inflammation"]] },
      { def: "Inflammation of the kidney",  roots: [["nephr","kidney"],["itis","inflammation"]] },
    ]},
    { theme: "Fields of study (-logy)", terms: [
      { def: "Study of the heart",  roots: [["cardio","heart"],["logy","study of"]] },
      { def: "Study of the nerves", roots: [["neuro","nerve"],["logy","study of"]] },
      { def: "Study of the skin",   roots: [["dermato","skin"],["logy","study of"]] },
      { def: "Study of blood",      roots: [["hemato","blood"],["logy","study of"]] },
    ]},
    { theme: "Surgical removals (-ectomy)", terms: [
      { def: "Removal of the stomach", roots: [["gastr","stomach"],["ectomy","removal"]] },
      { def: "Removal of the appendix",roots: [["append","appendix"],["ectomy","removal"]] },
      { def: "Removal of the tonsils", roots: [["tonsill","tonsils"],["ectomy","removal"]] },
      { def: "Removal of a kidney",    roots: [["nephr","kidney"],["ectomy","removal"]] },
    ]},
    { theme: "All about the heart", terms: [
      { def: "The sac around the heart",     roots: [["peri","around"],["cardium","heart"]] },
      { def: "The muscle wall of the heart", roots: [["myo","muscle"],["cardium","heart"]] },
      { def: "Abnormally fast heart rate",   roots: [["tachy","fast"],["cardia","heart"]] },
      { def: "Abnormally slow heart rate",   roots: [["brady","slow"],["cardia","heart"]] },
    ]},
    { theme: "Cells (-cyte)", terms: [
      { def: "A red blood cell",   roots: [["erythro","red"],["cyte","cell"]] },
      { def: "A white blood cell", roots: [["leuko","white"],["cyte","cell"]] },
      { def: "A bone cell",        roots: [["osteo","bone"],["cyte","cell"]] },
      { def: "A pigment cell",     roots: [["melano","dark"],["cyte","cell"]] },
    ]},
    { theme: "Pains (-algia)", terms: [
      { def: "Nerve pain",  roots: [["neur","nerve"],["algia","pain"]] },
      { def: "Muscle pain", roots: [["my","muscle"],["algia","pain"]] },
      { def: "Joint pain",  roots: [["arthr","joint"],["algia","pain"]] },
      { def: "Head pain",   roots: [["cephal","head"],["algia","pain"]] },
    ]},
    { theme: "Looking & recording", terms: [

    { theme: "Enlargements (-megaly)", terms: [

    { theme: "Colours in the body", terms: [

    { theme: "Conditions of the blood", terms: [

      { def: "Tissue death",          roots: [["necr","death"],["osis","condition"]] },
      { def: "Lack of red blood cells", roots: [["an","without"],["emia","blood"]] },
      { def: "Cancer of the blood",   roots: [["leuk","white"],["emia","blood"]] },
    ]},
    { theme: "Skin terms (derm)", terms: [
      { def: "The outer skin layer",    roots: [["epi","upon"],["dermis","skin"]] },
      { def: "Beneath the skin (a needle)", roots: [["hypo","under"],["derm","skin"],["ic","relating to"]] },
      { def: "The study of skin",       roots: [["dermato","skin"],["logy","study of"]] },
      { def: "Inflammation of the skin",roots: [["dermat","skin"],["itis","inflammation"]] },
    ]},
    { theme: "Three-root terms", terms: [
      { def: "A tracing of the heart's electrical activity", roots: [["electro","electric"],["cardio","heart"],["gram","record"]] },
      { def: "Wear-and-tear joint inflammation", roots: [["osteo","bone"],["arthr","joint"],["itis","inflammation"]] },
      { def: "Study of the stomach and intestines", roots: [["gastro","stomach"],["entero","intestine"],["logy","study of"]] },
      { def: "Beneath the skin (an injection)", roots: [["hypo","under"],["derm","skin"],["ic","relating to"]] },
    ]},
    { theme: "Position prefixes", terms: [
      { def: "Within a vein (an IV drip)", roots: [["intra","within"],["ven","vein"],["ous","relating to"]] },
      { def: "Beneath the tongue",  roots: [["sub","under"],["lingual","tongue"]] },
      { def: "Between the ribs",    roots: [["inter","between"],["costal","ribs"]] },
      { def: "Upon the skin",       roots: [["epi","upon"],["dermis","skin"]] },
    ]},
    { theme: "Tumours & disease", terms: [
      { def: "A cancerous tumour",   roots: [["carcin","cancer"],["oma","tumour"]] },
      { def: "A dark skin tumour",   roots: [["melan","dark"],["oma","tumour"]] },
      { def: "Disease of the nerves",roots: [["neuro","nerve"],["pathy","disease"]] },
      { def: "Disease of the muscle",roots: [["myo","muscle"],["pathy","disease"]] },
    ]},
  ];

  const MAX_MISTAKES = 4;
  const COLORS = ["#b59f3b", "#4a934a", "#4a7fd6", "#9a5fd0"];

  const $ = (id) => document.getElementById(id);
  const now = new Date();
  const dayNumber = Math.floor(Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()) / 86400000);
  const EPOCH_DAY = Math.floor(Date.UTC(2026, 7, 5) / 86400000);
  const dayIndex = Math.max(0, dayNumber - EPOCH_DAY);
  const puzzleNumber = dayIndex + 1;
  const dateKey = now.getFullYear() + "-" + (now.getMonth() + 1) + "-" + now.getDate();

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function seededShuffle(list, seed) {
    const a = list.slice(); const rnd = mulberry32(seed);
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  }

  const ORDER = seededShuffle(PUZZLES, 20260805);
  const puzzle = ORDER[dayIndex % ORDER.length];
  const TERMS = puzzle.terms;                                   // 4 clues
  const ANSWERS = TERMS.map((t) => t.roots.map((r) => r[0]).join(""));

  // QR to the games landing page (https://vashtag.github.io/Social/) — 29×29, ECC-M.
  const QR_SOCIAL_SIZE = 29;
  const QR_SOCIAL = "1111111001101111001010111111110000010100100010100001000001101110101011101010110010111011011101010001011010010101110110111010011111110111101011101100000100001011010101010000011111111010101010101010111111100000000100101000000100000000100000101010101101001110011101111100001111010011101011011000111110010110000100000010000110110011001101110000000010001110101000110110101010110000101101100000111100111101110011111000111101111111000101011000100110100011111000001101010111011010111000100000100101100111111011101000100011011101111110111101000111101100101100110100101100100101000011010000101110101011000001011111101110000000011011101011010001100011111110011001111101101011100100000100101110000011000100101011101001111101100111111101110111010011100011011100001101101110100101110111110111111101000001000100010100001000110111111110111110000101011111100";

  // The four terms' roots make the "real" tiles. Pad up to 12 with distractor
  // roots that don't belong to any answer, so the grid is never trivially small.
  const REAL = TERMS.flatMap((t, ci) => t.roots.map((r) => ({ frag: r[0], mean: r[1], term: ci })));
  const usedFrags = new Set(REAL.map((t) => t.frag));
  const DISTRACTORS = ["thermo","gluco","litho","phago","chondro","costo","entero","hydro","lipo","myelo",
    "onco","pyelo","rhino","sclero","thoraco","uro","vaso","glosso","masto","recto","salpingo","procto",
    "adeno","broncho","colo","pyo","kerato","cheilo","dacryo","splen","rrhea","plasty","ptosis","stasis",
    "trophy","genic","phage","lysis","clast","porosis"];
  const distractNeed = Math.max(0, 12 - REAL.length);
  const DISTRACT = seededShuffle(DISTRACTORS.filter((f) => !usedFrags.has(f)), 700 + dayIndex * 13)
    .slice(0, distractNeed).map((f) => ({ frag: f, mean: "", term: -1, distractor: true }));
  const POOL = seededShuffle(REAL.concat(DISTRACT), 613 + dayIndex * 17);

  // assign[c] = ordered list of POOL indices placed on clue c.
  let state = { assign: [[], [], [], []], solved: [false, false, false, false], mistakes: 0, focus: 0, finished: false };

  function gameKey() { return "anatomy-rootle-v2-" + dateKey; }
  function load() {
    try { const s = JSON.parse(localStorage.getItem(gameKey()) || "null"); if (s && s.assign) state = s; } catch (e) {}
  }
  function save() { try { localStorage.setItem(gameKey(), JSON.stringify(state)); } catch (e) {} }

  function usedSet() { const u = new Set(); state.assign.forEach((a) => a.forEach((i) => u.add(i))); return u; }
  function assignedClue(i) { for (let c = 0; c < 4; c++) if (state.assign[c].indexOf(i) !== -1) return c; return -1; }
  function wordFor(c) { return state.assign[c].map((i) => POOL[i].frag).join(""); }
  function firstUnsolved() { for (let c = 0; c < 4; c++) if (!state.solved[c]) return c; return 0; }

  function render() {
    if (state.finished || !state.solved[state.focus]) { /* keep focus */ }
    else state.focus = firstUnsolved();

    // Clues
    const clues = $("clues"); clues.innerHTML = "";
    TERMS.forEach((t, c) => {
      const el = document.createElement("div");
      el.className = "clue" + (state.solved[c] ? " solved c" + c : "") + (!state.solved[c] && c === state.focus && !state.finished ? " focus" : "");
      if (state.solved[c]) {
        const chips = t.roots.map((r, i) =>
          (i ? '<span class="plus">+</span>' : "") + '<span class="placed">' + r[0] + "</span>").join("");
        el.innerHTML =
          '<div class="solved-term">' + ANSWERS[c] + "</div>" +
          '<div class="clue-slots">' + chips + "</div>" +
          '<div class="solved-mean">' + t.def + " · <b>" + t.roots.map((r) => r[1]).join(" + ") + "</b></div>";
      } else {
        const need = t.roots.length;
        const placed = state.assign[c];
        let slots = "";
        for (let i = 0; i < need; i++) {
          if (i < placed.length) slots += '<span class="placed" data-remove="' + placed[i] + '">' + POOL[placed[i]].frag + "</span>";
          else slots += '<span class="slot-empty"></span>';
        }
        el.innerHTML = '<div class="clue-def">' + t.def + "</div>" + '<div class="clue-slots">' + slots + "</div>";
        el.addEventListener("click", (e) => {
          const rm = e.target.closest("[data-remove]");
          if (rm) { removeTile(c, +rm.dataset.remove); return; }
          state.focus = c; save(); render();
        });
      }
      clues.appendChild(el);
    });

    // Grid — tiles stay put; assigned ones take on their clue's colour.
    const grid = $("grid"); grid.innerHTML = "";
    POOL.forEach((tile, i) => {
      const el = document.createElement("div");
      const c = assignedClue(i);
      let cls = "tile";
      if (c !== -1) cls += (state.solved[c] ? " locked" : " picked") + " c" + c;
      el.className = cls;
      el.innerHTML = '<span class="tile-frag">' + tile.frag + "</span>";
      el.addEventListener("click", () => tileTap(i));
      grid.appendChild(el);
    });

    // Mistakes
    let dots = "";
    for (let i = 0; i < MAX_MISTAKES; i++) dots += '<span class="dot' + (i < state.mistakes ? " spent" : "") + '"></span>';
    $("mistakes").innerHTML = "Mistakes " + dots;

    const anyPlaced = state.assign[state.focus] && state.assign[state.focus].length > 0 && !state.solved[state.focus];
    $("clear").classList.toggle("hidden", state.finished || !anyPlaced);

    if (state.finished) showEnd();
    else $("end").classList.remove("show");
  }

  function tileTap(i) {
    if (state.finished) return;
    const c = assignedClue(i);
    if (c !== -1) { if (!state.solved[c]) removeTile(c, i); return; }  // tap again to unassign
    placeTile(i);
  }

  function placeTile(i) {
    if (state.finished) return;
    const c = state.focus;
    if (state.solved[c]) { state.focus = firstUnsolved(); return render(); }
    if (usedSet().has(i)) return;
    if (state.assign[c].length >= TERMS[c].roots.length) return;
    state.assign[c].push(i);
    save();
    if (state.assign[c].length === TERMS[c].roots.length) checkClue(c);
    else render();
  }

  function removeTile(c, i) {
    if (state.finished || state.solved[c]) return;
    const idx = state.assign[c].indexOf(i);
    if (idx !== -1) { state.assign[c].splice(idx, 1); save(); render(); }
  }

  function clearClue() {
    const c = state.focus;
    if (state.finished || state.solved[c]) return;
    state.assign[c] = []; save(); render();
  }

  function checkClue(c) {
    if (wordFor(c) === ANSWERS[c]) {
      state.solved[c] = true;
      save();
      if (state.solved.every(Boolean)) finish(true);
      else { state.focus = firstUnsolved(); render(); }
    } else {
      state.mistakes++;
      state.assign[c] = [];
      save();
      render();
      document.body.classList.add("shake");
      setTimeout(() => document.body.classList.remove("shake"), 430);
      if (state.mistakes >= MAX_MISTAKES) finish(false);
      else toast("Not a match — try again");
    }
  }

  function finish(won) {
    state.finished = true;
    state.won = won;
    // Reveal any unsolved clues with their correct roots.
    TERMS.forEach((t, c) => {
      if (!state.solved[c]) {
        // find pool indices for this term's roots that are still free
        const used = usedSet();
        const picks = [];
        t.roots.forEach((r) => {
          for (let i = 0; i < POOL.length; i++) {
            if (used.has(i) || picks.indexOf(i) !== -1) continue;
            if (POOL[i].frag === r[0]) { picks.push(i); break; }
          }
        });
        state.assign[c] = picks;
        state.solved[c] = true;
      }
    });
    save();
    render();
  }

  function showEnd() {
    $("clear").classList.add("hidden");
    const end = $("end"); end.classList.add("show");
    if (state.won) {
      $("end-title").textContent = state.mistakes === 0 ? "Perfect!" : "Solved it!";
      $("end-sub").innerHTML = state.mistakes === 0
        ? "All four terms, no mistakes."
        : "All four terms with <b>" + state.mistakes + "</b> mistake" + (state.mistakes === 1 ? "" : "s") + ".";
    } else {
      $("end-title").textContent = "Out of tries";
      $("end-sub").innerHTML = "Here's how the roots fit together.";
    }
  }

  /* ── Share text (Connections-style colour grid) ── */
  function buildShareText() {
    const sq = ["🟨", "🟩", "🟦", "🟪"];
    const rows = TERMS.map((t, c) => sq[c].repeat(t.roots.length)).join("\n");
    const head = "Anatomy Rootle No. " + puzzleNumber +
      (state.won ? " — " + (state.mistakes === 0 ? "perfect" : state.mistakes + " mistake" + (state.mistakes === 1 ? "" : "s")) : " — stumped");
    return head + "\n" + rows + "\n" + location.origin + location.pathname;
  }
  async function shareText() {
    const text = buildShareText();
    if (navigator.share) { try { await navigator.share({ text }); return; } catch (e) {} }
    try { await navigator.clipboard.writeText(text); toast("Copied to clipboard!"); }
    catch (e) { toast("Copy failed"); }
  }

  /* ── Selfie + share to story ── */
  let _camStream = null, _lastBlob = null;
  function stopCam() { if (_camStream) { _camStream.getTracks().forEach((t) => t.stop()); _camStream = null; } }
  async function openCam() {
    try {
      _camStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false });
      $("cam-video").srcObject = _camStream; $("cam-modal").classList.add("show");
    } catch (e) { toast("Camera unavailable — copying text"); shareText(); }
  }
  function closeCam() { $("cam-modal").classList.remove("show"); stopCam(); }

  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath(); ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }
  function drawQR(ctx, boxX, boxY, box) {
    const quiet = 4, total = QR_SOCIAL_SIZE + quiet * 2, m = box / total;
    roundRect(ctx, boxX, boxY, box, box, m * 2);
    ctx.fillStyle = "#f0ece4"; ctx.fill();
    ctx.fillStyle = "#0d0d0d";
    for (let r = 0; r < QR_SOCIAL_SIZE; r++) {
      for (let c = 0; c < QR_SOCIAL_SIZE; c++) {
        if (QR_SOCIAL[r * QR_SOCIAL_SIZE + c] === "1") {
          ctx.fillRect(boxX + (quiet + c) * m, boxY + (quiet + r) * m, Math.ceil(m) + 0.6, Math.ceil(m) + 0.6);
        }
      }
    }
  }

  function capture() {
    const video = $("cam-video");
    const W = 1080, H = 1920;
    const canvas = document.createElement("canvas");
    canvas.width = W; canvas.height = H;
    const ctx = canvas.getContext("2d");
    ctx.fillStyle = "#0d0d0d"; ctx.fillRect(0, 0, W, H);

    const vw = video.videoWidth || 1080, vh = video.videoHeight || 1920;
    const regionH = Math.round(H * 0.56);
    const scale = Math.min(W / vw, regionH / vh);
    const dw = vw * scale, dh = vh * scale;
    const dx = (W - dw) / 2, dy = (regionH - dh) / 2;
    ctx.save(); ctx.translate(W, 0); ctx.scale(-1, 1); ctx.drawImage(video, dx, dy, dw, dh); ctx.restore();

    const grad = ctx.createLinearGradient(0, regionH - 120, 0, regionH + 20);
    grad.addColorStop(0, "rgba(13,13,13,0)"); grad.addColorStop(1, "rgba(13,13,13,1)");
    ctx.fillStyle = grad; ctx.fillRect(0, regionH - 120, W, 140);

    const cx = W / 2, panelTop = regionH;
    ctx.textAlign = "center";

    ctx.fillStyle = "rgba(240,236,228,0.6)";
    ctx.font = "600 " + Math.round(W * 0.03) + "px -apple-system,'Segoe UI',sans-serif";
    ctx.fillText("A N A T O M Y   R O O T L E", cx, panelTop + 70);

    ctx.fillStyle = "#f0ece4";
    ctx.font = "800 " + Math.round(W * 0.088) + "px -apple-system,'Segoe UI',sans-serif";
    ctx.fillText(state.won ? "SOLVED" : "STUMPED", cx, panelTop + 166);

    ctx.fillStyle = "rgba(240,236,228,0.65)";
    ctx.font = "600 " + Math.round(W * 0.034) + "px -apple-system,'Segoe UI',sans-serif";
    const scoreTxt = state.won ? (state.mistakes === 0 ? "no mistakes" : state.mistakes + " mistake" + (state.mistakes === 1 ? "" : "s")) : "the roots revealed";
    ctx.fillText("No. " + puzzleNumber + "  ·  " + scoreTxt, cx, panelTop + 220);

    // Four rows: coloured squares per term
    const sq = Math.round(W * 0.05), gap = Math.round(W * 0.018), rowGap = Math.round(W * 0.02);
    let y = panelTop + 270;
    TERMS.forEach((t, c) => {
      const n = t.roots.length;
      const rowW = n * sq + (n - 1) * gap;
      let x = cx - rowW / 2;
      for (let i = 0; i < n; i++) {
        ctx.fillStyle = COLORS[c];
        roundRect(ctx, x, y, sq, sq, sq * 0.28); ctx.fill();
        x += sq + gap;
      }
      y += sq + rowGap;
    });

    // QR to the social page
    const qrBox = Math.round(W * 0.17);
    const qrTop = H - 96 - qrBox;
    drawQR(ctx, cx - qrBox / 2, qrTop, qrBox);
    ctx.fillStyle = "rgba(240,236,228,0.55)";
    ctx.font = "600 " + Math.round(W * 0.023) + "px -apple-system,'Segoe UI',sans-serif";
    ctx.fillText("S C A N   T O   P L A Y", cx, qrTop + qrBox + 36);

    const dataUrl = canvas.toDataURL("image/png");
    $("cam-img").src = dataUrl;
    canvas.toBlob((b) => { _lastBlob = b; }, "image/png");
    closeCam();
    $("cam-preview").classList.add("show");
  }

  async function shareImage() {
    if (_lastBlob && navigator.canShare) {
      const file = new File([_lastBlob], "anatomy-rootle.png", { type: "image/png" });
      if (navigator.canShare({ files: [file] })) {
        try { await navigator.share({ files: [file], title: "Anatomy Rootle" }); return; }
        catch (e) { if (e && e.name === "AbortError") return; }
      }
    }
    await saveImage();
    setTimeout(openInstagramStory, 500);
  }

  function dataURLtoBlob(dataUrl) {
    const parts = dataUrl.split(",");
    const mime = (parts[0].match(/:(.*?);/) || [])[1] || "image/png";
    const bin = atob(parts[1]); const arr = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    return new Blob([arr], { type: mime });
  }

  async function saveImage() {
    if (!_lastBlob) {
      const src = $("cam-img").src;
      if (src && src.indexOf("data:") === 0) { try { _lastBlob = dataURLtoBlob(src); } catch (e) {} }
    }
    if (!_lastBlob) { toast("Preparing photo — try again"); return; }
    const filename = "anatomy-rootle-" + puzzleNumber + ".png";
    const file = new File([_lastBlob], filename, { type: "image/png" });
    const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) ||
      (navigator.maxTouchPoints > 1 && /Mac/.test(navigator.platform));
    if (isMobile && navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file] }); return; }
      catch (e) { if (e && e.name === "AbortError") return; }
    }
    const url = URL.createObjectURL(_lastBlob);
    const a = document.createElement("a"); a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    toast("Photo saved");
  }

  function openInstagramStory() {
    const started = Date.now();
    window.location.href = "instagram://story-camera";
    setTimeout(() => {
      if (Date.now() - started < 1800 && !document.hidden) window.location.href = "https://www.instagram.com/";
    }, 1200);
  }
  function closePreview() { $("cam-preview").classList.remove("show"); }

  let toastTimer;
  function toast(msg) {
    const t = $("toast"); t.textContent = msg; t.classList.add("show");
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 1600);
  }

  /* ── Events ── */
  $("clear").addEventListener("click", clearClue);
  $("share").addEventListener("click", openCam);
  $("copy-text").addEventListener("click", shareText);
  $("cam-shutter").addEventListener("click", capture);
  $("cam-close").addEventListener("click", closeCam);
  $("cam-share-img").addEventListener("click", shareImage);
  $("cam-download").addEventListener("click", saveImage);
  $("cam-preview-close").addEventListener("click", closePreview);

  // Hidden reset: tap the "No. X" label 5 times to replay today's puzzle.
  let _tapCount = 0, _tapTimer = null;
  $("day-num").addEventListener("click", () => {
    _tapCount++; clearTimeout(_tapTimer);
    _tapTimer = setTimeout(() => { _tapCount = 0; }, 1200);
    if (_tapCount >= 5) {
      _tapCount = 0; clearTimeout(_tapTimer);
      try { localStorage.removeItem(gameKey()); } catch (e) {}
      state = { assign: [[], [], [], []], solved: [false, false, false, false], mistakes: 0, focus: 0, finished: false };
      render(); toast("Puzzle reset");
    }
  });

  try {
    $("day-date").textContent = now.toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });
  } catch (e) {}
  $("day-num").textContent = "No. " + puzzleNumber;

  load();
  render();
  </script>
</body>
</html>
