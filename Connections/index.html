<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Anatomy Connections</title>
  <meta name="description" content="Group the sixteen anatomy terms into four secret sets. A new puzzle every day." />

  <!-- Social share preview -->
  <meta property="og:title" content="Anatomy Connections" />
  <meta property="og:description" content="Find the four hidden groups of four. A new anatomy puzzle every day — how few mistakes can you make?" />
  <meta property="og:type" content="website" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0d0d;
      --surface: #161616;
      --surface-2: #1d1d1d;
      --border: #242424;
      --text: #f0ece4;
      --muted: #666;
      --tile: #1c1c1c;
      --tile-border: #2a2a2a;

      /* NYT-style difficulty colours, tuned for a dark UI */
      --cat-yellow: #b59f3b;
      --cat-green:  #4a934a;
      --cat-blue:   #4a7fd6;
      --cat-purple: #9a5fd0;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    body {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.25rem 1rem calc(1.5rem + env(safe-area-inset-bottom));
    }

    .wrap {
      width: 100%;
      max-width: 560px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.25rem 0.1rem 1.1rem;
      border-bottom: 1px solid var(--border);
      margin-bottom: 1.25rem;
    }
    .brand { display: flex; flex-direction: column; gap: 0.25rem; }
    .brand-title {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    .brand-sub {
      font-size: 0.6rem;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .back-link {
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--muted);
      text-decoration: none;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 0.5rem 0.9rem;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .back-link:hover { color: var(--text); border-color: #3a3a3a; }

    .daystrip {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 1rem;
    }
    .day-label {
      font-size: 0.62rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .day-num { font-size: 0.62rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--text); font-weight: 700; }

    .prompt {
      text-align: center;
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 1rem;
      min-height: 1.1rem;
    }

    /* ── Solved category banners ── */
    .solved-list { display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 0.5rem; }
    .solved {
      border-radius: 12px;
      padding: 0.7rem 1rem;
      text-align: center;
      color: #0d0d0d;
      animation: pop 0.35s ease;
    }
    .solved-title {
      font-size: 0.82rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .solved-words {
      font-size: 0.78rem;
      font-weight: 600;
      margin-top: 0.15rem;
      opacity: 0.85;
    }
    .cat-0 { background: var(--cat-yellow); }
    .cat-1 { background: var(--cat-green); }
    .cat-2 { background: var(--cat-blue); }
    .cat-3 { background: var(--cat-purple); }

    @keyframes pop {
      0% { transform: scale(0.96); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    /* ── Grid ── */
    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.5rem;
      margin-bottom: 1.25rem;
    }
    .tile {
      position: relative;
      background: var(--tile);
      border: 1px solid var(--tile-border);
      border-radius: 12px;
      aspect-ratio: 1 / 1;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 0.25rem;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      transition: transform 0.08s ease, background 0.15s, border-color 0.15s, color 0.15s;
    }
    .tile-word {
      font-size: clamp(0.6rem, 3vw, 0.95rem);
      font-weight: 700;
      letter-spacing: 0.01em;
      text-transform: uppercase;
      line-height: 1.05;
      word-break: break-word;
      hyphens: auto;
    }
    .tile:hover { border-color: #3d3d3d; }
    .tile.selected {
      background: var(--text);
      color: var(--bg);
      border-color: var(--text);
      transform: scale(0.97);
    }
    .tile.disabled { pointer-events: none; }

    .tile.shake { animation: shake 0.4s ease; }
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20% { transform: translateX(-6px); }
      40% { transform: translateX(6px); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(4px); }
    }
    .tile.jump { animation: jump 0.45s ease; }
    @keyframes jump {
      0%,100% { transform: translateY(0); }
      35% { transform: translateY(-10px); }
    }

    /* ── Mistakes ── */
    .mistakes {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      margin-bottom: 1.25rem;
      font-size: 0.75rem;
      color: var(--muted);
      letter-spacing: 0.05em;
    }
    .dots { display: flex; gap: 0.4rem; }
    .dot {
      width: 12px; height: 12px;
      border-radius: 50%;
      background: var(--text);
      transition: all 0.3s;
    }
    .dot.used { background: var(--surface-2); border: 1px solid var(--border); transform: scale(0.85); }

    /* ── Controls ── */
    .controls {
      display: flex;
      gap: 0.6rem;
      margin-top: auto;
    }
    .btn {
      flex: 1;
      background: transparent;
      color: var(--text);
      border: 1px solid #3a3a3a;
      border-radius: 999px;
      padding: 0.85rem 0.5rem;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn:hover:not(:disabled) { background: rgba(255,255,255,0.06); }
    .btn:active:not(:disabled) { transform: scale(0.98); }
    .btn:disabled { opacity: 0.35; cursor: default; }
    .btn-submit {
      background: var(--text);
      color: var(--bg);
      border-color: var(--text);
    }
    .btn-submit:hover:not(:disabled) { background: #fff; }

    /* ── End state ── */
    .end {
      margin-top: 1.5rem;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      text-align: center;
    }
    .end.show { display: flex; }
    .end-title { font-size: 1.3rem; font-weight: 800; letter-spacing: -0.01em; }
    .end-sub { font-size: 0.85rem; color: var(--muted); }
    .share-grid {
      font-size: 1.4rem;
      line-height: 1.35;
      letter-spacing: 0.15em;
    }
    .end-actions { display: flex; gap: 0.6rem; width: 100%; }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 2rem;
      transform: translateX(-50%) translateY(20px);
      background: var(--text);
      color: var(--bg);
      padding: 0.7rem 1.2rem;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 700;
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s;
      z-index: 50;
      white-space: nowrap;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    .text-share {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 0.72rem;
      letter-spacing: 0.05em;
      text-decoration: underline;
      text-underline-offset: 3px;
      cursor: pointer;
      padding: 0.2rem;
    }
    .text-share:hover { color: var(--text); }

    /* ── Selfie camera + preview ── */
    .cam-modal, .cam-preview {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: #000;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .cam-modal.show, .cam-preview.show { display: flex; }

    #cam-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1); /* mirror like a real selfie cam */
    }
    .cam-ui {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      gap: 1.1rem;
      padding: 1.5rem 1.25rem calc(2.2rem + env(safe-area-inset-bottom));
    }
    .cam-hint {
      max-width: 320px;
      text-align: center;
      color: rgba(255,255,255,0.82);
      font-size: 0.78rem;
      line-height: 1.4;
      text-shadow: 0 1px 6px rgba(0,0,0,0.6);
    }
    .cam-shutter {
      width: 74px;
      height: 74px;
      border-radius: 50%;
      background: #fff;
      border: 5px solid rgba(255,255,255,0.45);
      cursor: pointer;
      transition: transform 0.1s;
    }
    .cam-shutter:active { transform: scale(0.92); }
    .cam-close {
      background: rgba(0,0,0,0.35);
      border: 1px solid rgba(255,255,255,0.25);
      color: #fff;
      border-radius: 999px;
      padding: 0.55rem 1.4rem;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      cursor: pointer;
    }

    .cam-preview {
      gap: 1rem;
      padding: 1.25rem 1.25rem calc(1.5rem + env(safe-area-inset-bottom));
      justify-content: center;
    }
    #cam-img {
      max-width: 100%;
      max-height: 68vh;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.12);
    }
    .cam-preview-actions {
      display: flex;
      gap: 0.6rem;
      width: 100%;
      max-width: 420px;
    }
    .cam-preview-actions .btn { flex: 1; display: grid; place-items: center; text-decoration: none; }

    footer {
      margin-top: 1.75rem;
      text-align: center;
      font-size: 0.62rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #333;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">
        <div class="brand-title">Connections</div>
        <div class="brand-sub">Anatomy Edition</div>
      </div>
      <a class="back-link" href="../">← Games</a>
    </header>

    <div class="daystrip">
      <span class="day-label" id="day-date">Puzzle of the day</span>
      <span class="day-num" id="day-num"></span>
    </div>

    <div class="prompt">Create four groups of four!</div>

    <div class="solved-list" id="solved-list"></div>
    <div class="grid" id="grid"></div>

    <div class="mistakes">
      <span>Mistakes remaining</span>
      <span class="dots" id="dots"></span>
    </div>

    <div class="controls" id="controls">
      <button class="btn" id="shuffle">Shuffle</button>
      <button class="btn" id="deselect" disabled>Deselect</button>
      <button class="btn btn-submit" id="submit" disabled>Submit</button>
    </div>

    <div class="end" id="end">
      <div class="end-title" id="end-title"></div>
      <div class="end-sub" id="end-sub"></div>
      <div class="share-grid" id="share-grid"></div>
      <div class="end-actions">
        <button class="btn btn-submit" id="share">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align:-3px;margin-right:0.4rem;">
            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
            <circle cx="12" cy="13" r="4"/>
          </svg>Share result
        </button>
        <a class="btn" id="home-link" href="../" style="display:grid;place-items:center;text-decoration:none;">More games</a>
      </div>
      <button class="text-share" id="copy-text">or copy text result</button>
    </div>

    <!-- Selfie camera -->
    <div class="cam-modal" id="cam-modal">
      <video id="cam-video" autoplay playsinline muted></video>
      <div class="cam-ui">
        <div class="cam-hint">Line up your selfie — your result gets added to the photo.</div>
        <button class="cam-shutter" id="cam-shutter" aria-label="Take photo"></button>
        <button class="cam-close" id="cam-close">Cancel</button>
      </div>
    </div>

    <!-- Composited result preview -->
    <div class="cam-preview" id="cam-preview">
      <img id="cam-img" alt="Your Connections result" />
      <div class="cam-preview-actions">
        <button class="btn btn-submit" id="cam-share-img">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align:-3px;margin-right:0.35rem;">
            <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/>
          </svg>Share to story
        </button>
        <a class="btn" id="cam-download" download>Save photo</a>
      </div>
      <button class="cam-close" id="cam-preview-close">Done</button>
      <div class="cam-hint" id="cam-preview-hint">Tap “Share to story”, then pick Instagram → Stories.</div>
    </div>

    <footer>vashtag · social games</footer>
  </div>

  <div class="toast" id="toast"></div>

  <script>
  /* ==========================================================================
     PUZZLES — anatomy themed.
     Each puzzle has four groups. Order groups from easiest (0) to hardest (3):
     0 = yellow, 1 = green, 2 = blue, 3 = purple (NYT convention).
     A new puzzle is served each day, rotating through this list.
     ========================================================================== */
  const PUZZLES = [
    {
      // Trap: BALL & SADDLE read as joint types; JAW reads as a facial bone.
      groups: [
        { title: "Bones of the leg", words: ["FEMUR", "TIBIA", "FIBULA", "PATELLA"] },
        { title: "Types of joint", words: ["HINGE", "PIVOT", "GLIDING", "SADDLE"] },
        { title: "Parts of the foot", words: ["HEEL", "ARCH", "BALL", "SOLE"] },
        { title: "___ bone", words: ["FUNNY", "WISH", "JAW", "BACK"] },
      ],
    },
    {
      // Trap: STOMACH tempts the idiom set; every purple word is also an organ.
      groups: [
        { title: "Digestive organs", words: ["STOMACH", "LIVER", "INTESTINE", "PANCREAS"] },
        { title: "Endocrine glands", words: ["THYROID", "PITUITARY", "ADRENAL", "PINEAL"] },
        { title: "Blood components", words: ["PLASMA", "PLATELET", "ANTIBODY", "HEMOGLOBIN"] },
        { title: "To have ___ (courage)", words: ["GUTS", "NERVE", "HEART", "SPINE"] },
      ],
    },
    {
      // Trap: LOBE tempts the brain lobes; JAW & CHEEK tempt the facial bones.
      groups: [
        { title: "Facial features", words: ["NOSE", "CHIN", "CHEEK", "JAW"] },
        { title: "Lobes of the brain", words: ["FRONTAL", "PARIETAL", "TEMPORAL", "OCCIPITAL"] },
        { title: "Facial bones", words: ["MANDIBLE", "MAXILLA", "ZYGOMATIC", "VOMER"] },
        { title: "Parts of the ear", words: ["LOBE", "DRUM", "CANAL", "HELIX"] },
      ],
    },
    {
      // Trap: CROWN, GUM & BRIDGE tempt the tooth set; CANINE looks like a tooth.
      groups: [
        { title: "Respiratory system", words: ["TRACHEA", "BRONCHI", "ALVEOLI", "DIAPHRAGM"] },
        { title: "Digestive tract", words: ["ESOPHAGUS", "STOMACH", "COLON", "RECTUM"] },
        { title: "Types of tooth", words: ["INCISOR", "CANINE", "MOLAR", "PREMOLAR"] },
        { title: "Dental terms hiding in plain sight", words: ["PALATE", "CROWN", "GUM", "BRIDGE"] },
      ],
    },
    {
      // Trap: RADIAL & ULNAR nerves echo the arm bones; WRIST spans two sets.
      groups: [
        { title: "Regions of the arm", words: ["SHOULDER", "ELBOW", "WRIST", "FOREARM"] },
        { title: "Bones of the hand & wrist", words: ["CARPAL", "METACARPAL", "PHALANX", "SCAPHOID"] },
        { title: "Nerves of the arm", words: ["RADIAL", "ULNAR", "MEDIAN", "AXILLARY"] },
        { title: "The fingers", words: ["INDEX", "RING", "MIDDLE", "PINKY"] },
      ],
    },
    {
      // Trap: PANCREAS is also a digestive organ; the membranes are the deep cut.
      groups: [
        { title: "Abdominal organs", words: ["LIVER", "SPLEEN", "KIDNEY", "GALLBLADDER"] },
        { title: "Regions of the spine", words: ["CERVICAL", "THORACIC", "LUMBAR", "SACRAL"] },
        { title: "Endocrine glands", words: ["THYROID", "PITUITARY", "ADRENAL", "PANCREAS"] },
        { title: "Serous membranes", words: ["PLEURA", "PERITONEUM", "PERICARDIUM", "MENINGES"] },
      ],
    },
    {
      // Trap: SMELL sits with the senses, not the tastes; BALANCE is a real sense.
      groups: [
        { title: "The senses", words: ["VISION", "HEARING", "BALANCE", "SMELL"] },
        { title: "Parts of a neuron", words: ["AXON", "DENDRITE", "SOMA", "MYELIN"] },
        { title: "Brain structures", words: ["CEREBELLUM", "THALAMUS", "HIPPOCAMPUS", "AMYGDALA"] },
        { title: "The basic tastes", words: ["SWEET", "SOUR", "SALTY", "UMAMI"] },
      ],
    },
  ];

  /* ========================================================================== */
  const $ = (id) => document.getElementById(id);
  const gridEl = $("grid");
  const solvedEl = $("solved-list");
  const dotsEl = $("dots");
  const promptEl = document.querySelector(".prompt");
  const MAX_MISTAKES = 4;

  // ── Puzzle of the day ──────────────────────────────────────────────────────
  // Deterministic per calendar day: everyone gets the same puzzle on the same
  // date, and it changes at local midnight.
  const now = new Date();
  const dayNumber = Math.floor(
    (Date.UTC(now.getFullYear(), now.getMonth(), now.getDate())) / 86400000
  );
  const puzzleIndex = ((dayNumber % PUZZLES.length) + PUZZLES.length) % PUZZLES.length;
  const dateKey = now.getFullYear() + "-" + (now.getMonth() + 1) + "-" + now.getDate();

  let state;

  function shuffleArr(a) {
    const arr = a.slice();
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function storageKey() { return "anatomy-connections-v1-" + dateKey; }

  function initState() {
    const puzzle = PUZZLES[puzzleIndex];
    const wordGroup = {};
    puzzle.groups.forEach((g, gi) => g.words.forEach((w) => (wordGroup[w] = gi)));
    const allWords = puzzle.groups.flatMap((g) => g.words);

    state = {
      puzzle,
      wordGroup,
      order: shuffleArr(allWords),
      selected: [],
      solved: [],
      mistakes: 0,
      guesses: [],
      finished: false,
    };

    // Restore a finished result for today (so refreshing shows the share grid)
    try {
      const saved = JSON.parse(localStorage.getItem(storageKey()) || "null");
      if (saved && saved.finished) {
        state.solved = saved.solved;
        state.mistakes = saved.mistakes;
        state.guesses = saved.guesses;
        state.finished = true;
      }
    } catch (e) {}

    // Human-readable date label
    try {
      $("day-date").textContent = now.toLocaleDateString(undefined, {
        weekday: "long", month: "long", day: "numeric",
      });
    } catch (e) {}
    $("day-num").textContent = "No. " + (puzzleIndex + 1);

    render();
  }

  function persist() {
    if (state.finished) {
      localStorage.setItem(
        storageKey(),
        JSON.stringify({
          finished: true,
          solved: state.solved,
          mistakes: state.mistakes,
          guesses: state.guesses,
        })
      );
    }
  }

  function render() {
    // Solved banners
    solvedEl.innerHTML = "";
    state.solved.forEach((gi) => {
      const g = state.puzzle.groups[gi];
      const div = document.createElement("div");
      div.className = "solved cat-" + gi;
      div.innerHTML =
        '<div class="solved-title">' + g.title + "</div>" +
        '<div class="solved-words">' + g.words.join(" · ") + "</div>";
      solvedEl.appendChild(div);
    });

    // Grid: only words not yet solved
    const solvedWords = new Set(
      state.solved.flatMap((gi) => state.puzzle.groups[gi].words)
    );
    gridEl.innerHTML = "";
    state.order
      .filter((w) => !solvedWords.has(w))
      .forEach((w) => {
        const tile = document.createElement("button");
        tile.className = "tile";
        if (state.selected.includes(w)) tile.classList.add("selected");
        tile.innerHTML = '<span class="tile-word">' + w + "</span>";
        tile.dataset.word = w;
        tile.addEventListener("click", () => toggle(w));
        gridEl.appendChild(tile);
      });

    // Mistake dots
    dotsEl.innerHTML = "";
    for (let i = 0; i < MAX_MISTAKES; i++) {
      const d = document.createElement("span");
      d.className = "dot" + (i < state.mistakes ? " used" : "");
      dotsEl.appendChild(d);
    }

    updateControls();

    if (state.finished) showEnd();
    else $("end").classList.remove("show");
  }

  function updateControls() {
    const n = state.selected.length;
    $("deselect").disabled = n === 0 || state.finished;
    $("submit").disabled = n !== 4 || state.finished;
    $("shuffle").disabled = state.finished;
  }

  function toggle(w) {
    if (state.finished) return;
    const idx = state.selected.indexOf(w);
    if (idx >= 0) state.selected.splice(idx, 1);
    else if (state.selected.length < 4) state.selected.push(w);
    [...gridEl.children].forEach((t) =>
      t.classList.toggle("selected", state.selected.includes(t.dataset.word))
    );
    updateControls();
  }

  function tilesFor(words) {
    return [...gridEl.children].filter((t) => words.includes(t.dataset.word));
  }

  function submit() {
    if (state.selected.length !== 4 || state.finished) return;
    const picks = state.selected.slice();

    tilesFor(picks).forEach((t, i) => {
      t.classList.add("jump");
      t.style.animationDelay = i * 0.08 + "s";
      setTimeout(() => { t.classList.remove("jump"); t.style.animationDelay = ""; }, 500 + i * 80);
    });

    setTimeout(() => evaluate(picks), 520);
  }

  function evaluate(picks) {
    const groups = picks.map((w) => state.wordGroup[w]);
    state.guesses.push(groups.slice());

    const first = groups[0];
    const allSame = groups.every((g) => g === first);

    if (allSame) {
      state.solved.push(first);
      state.selected = [];
      render();
      if (state.solved.length === 4) finish(true);
      return;
    }

    // wrong guess — detect "one away"
    const counts = {};
    groups.forEach((g) => (counts[g] = (counts[g] || 0) + 1));
    const maxSame = Math.max(...Object.values(counts));

    state.mistakes++;
    tilesFor(picks).forEach((t) => {
      t.classList.add("shake");
      setTimeout(() => t.classList.remove("shake"), 400);
    });

    if (maxSame === 3) toast("One away…");
    else toast("Not quite");

    render();

    if (state.mistakes >= MAX_MISTAKES) finish(false);
  }

  function finish(won) {
    state.finished = true;
    if (!won) {
      const remaining = [0, 1, 2, 3].filter((gi) => !state.solved.includes(gi));
      state.solved = state.solved.concat(remaining);
    }
    state.selected = [];
    persist();
    render();
  }

  function shareGridText() {
    const emoji = ["🟨", "🟩", "🟦", "🟪"];
    return state.guesses
      .map((row) => row.map((g) => emoji[g]).join(""))
      .join("\n");
  }

  function showEnd() {
    const end = $("end");
    end.classList.add("show");
    $("controls").style.display = "none";
    promptEl.textContent = "";

    const won = state.mistakes < MAX_MISTAKES;
    $("end-title").textContent = won ? "Solved it!" : "Out of guesses";
    $("end-sub").textContent = won
      ? "Nice work — " + state.mistakes + (state.mistakes === 1 ? " mistake" : " mistakes")
      : "Come back tomorrow for a new puzzle";
    $("share-grid").textContent = shareGridText();
  }

  function buildShareText() {
    const won = state.mistakes < MAX_MISTAKES;
    const header =
      "Anatomy Connections No. " + (puzzleIndex + 1) +
      (won ? " — solved with " + state.mistakes + "/4 mistakes" : " — did not solve");
    return (
      header + "\n" +
      shareGridText() +
      "\n" + location.origin + location.pathname
    );
  }

  async function shareText() {
    const text = buildShareText();
    if (navigator.share) {
      try { await navigator.share({ text }); return; } catch (e) {}
    }
    try {
      await navigator.clipboard.writeText(text);
      toast("Copied to clipboard!");
    } catch (e) {
      toast("Copy failed");
    }
  }

  /* ── Selfie + share to story ─────────────────────────────────────────────
     Take a front-camera selfie, composite the result onto it (portrait 9:16
     so it fits an Instagram Story), then hand it to the OS share sheet as an
     image file. Falls back to copying the text result if there's no camera. */
  const CAT_COLORS = ["#b59f3b", "#4a934a", "#4a7fd6", "#9a5fd0"];
  let _camStream = null;
  let _lastBlob = null;

  function stopCam() {
    if (_camStream) { _camStream.getTracks().forEach((t) => t.stop()); _camStream = null; }
  }

  async function openCam() {
    const video = $("cam-video");
    try {
      _camStream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "user", width: { ideal: 1080 }, height: { ideal: 1920 } },
        audio: false,
      });
      video.srcObject = _camStream;
      $("cam-modal").classList.add("show");
    } catch (e) {
      // No camera / permission denied / insecure context → text share instead
      toast("Camera unavailable — copying text");
      shareText();
    }
  }

  function closeCam() {
    $("cam-modal").classList.remove("show");
    stopCam();
  }

  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function capture() {
    const video = $("cam-video");
    const W = 1080, H = 1920;
    const canvas = document.createElement("canvas");
    canvas.width = W; canvas.height = H;
    const ctx = canvas.getContext("2d");

    // Cover-fit the (mirrored) selfie into the whole frame
    const vw = video.videoWidth || 1080;
    const vh = video.videoHeight || 1920;
    const scale = Math.max(W / vw, H / vh);
    const dw = vw * scale, dh = vh * scale;
    const dx = (W - dw) / 2, dy = (H - dh) / 2;
    ctx.save();
    ctx.translate(W, 0); ctx.scale(-1, 1);
    ctx.drawImage(video, dx, dy, dw, dh);
    ctx.restore();

    // Bottom scrim for legibility
    const grad = ctx.createLinearGradient(0, H * 0.4, 0, H);
    grad.addColorStop(0, "rgba(0,0,0,0)");
    grad.addColorStop(0.45, "rgba(0,0,0,0.72)");
    grad.addColorStop(1, "rgba(13,13,13,0.96)");
    ctx.fillStyle = grad;
    ctx.fillRect(0, H * 0.4, W, H * 0.6);

    const cx = W / 2;
    const won = state.mistakes < MAX_MISTAKES;

    // Result emoji-style grid (rounded colour squares)
    const rows = state.guesses.length || 1;
    const sq = Math.round(W * 0.055);
    const gap = Math.round(W * 0.016);
    const gridW = 4 * sq + 3 * gap;
    const gridH = rows * sq + (rows - 1) * gap;
    const gridBottom = H * 0.885;
    const gy = gridBottom - gridH;
    const gx0 = cx - gridW / 2;
    state.guesses.forEach((row, r) => {
      row.forEach((gi, c) => {
        const x = gx0 + c * (sq + gap);
        const y = gy + r * (sq + gap);
        roundRect(ctx, x, y, sq, sq, sq * 0.24);
        ctx.fillStyle = CAT_COLORS[gi];
        ctx.fill();
      });
    });

    // Text above the grid
    ctx.textAlign = "center";
    ctx.fillStyle = "rgba(240,236,228,0.6)";
    ctx.font = "600 " + Math.round(W * 0.033) + "px -apple-system,'Segoe UI',sans-serif";
    ctx.fillText("A N A T O M Y   C O N N E C T I O N S", cx, gy - W * 0.155);

    ctx.fillStyle = "#f0ece4";
    ctx.font = "800 " + Math.round(W * 0.1) + "px -apple-system,'Segoe UI',sans-serif";
    ctx.fillText(won ? "SOLVED" : "SO CLOSE", cx, gy - W * 0.06);

    ctx.fillStyle = "rgba(240,236,228,0.65)";
    ctx.font = "600 " + Math.round(W * 0.036) + "px -apple-system,'Segoe UI',sans-serif";
    const sub = won
      ? "No. " + (puzzleIndex + 1) + "  ·  " + state.mistakes + (state.mistakes === 1 ? " mistake" : " mistakes")
      : "No. " + (puzzleIndex + 1) + "  ·  out of guesses";
    ctx.fillText(sub, cx, gy - W * 0.02);

    // URL footer
    ctx.fillStyle = "rgba(240,236,228,0.5)";
    ctx.font = "600 " + Math.round(W * 0.03) + "px -apple-system,'Segoe UI',sans-serif";
    ctx.fillText((location.host + location.pathname).replace(/\/$/, ""), cx, H * 0.95);

    // Emit
    const dataUrl = canvas.toDataURL("image/png");
    $("cam-img").src = dataUrl;
    const dl = $("cam-download");
    dl.href = dataUrl;
    dl.download = "anatomy-connections-" + (puzzleIndex + 1) + ".png";
    canvas.toBlob((b) => { _lastBlob = b; }, "image/png");

    closeCam();
    $("cam-preview").classList.add("show");
  }

  async function shareImage() {
    if (_lastBlob && navigator.canShare) {
      const file = new File([_lastBlob], "anatomy-connections.png", { type: "image/png" });
      if (navigator.canShare({ files: [file] })) {
        try { await navigator.share({ files: [file], title: "Anatomy Connections" }); return; }
        catch (e) { if (e && e.name === "AbortError") return; }
      }
    }
    // Fallback: save the image
    toast("Opening save…");
    $("cam-download").click();
  }

  function closePreview() {
    $("cam-preview").classList.remove("show");
  }

  let toastTimer;
  function toast(msg) {
    const t = $("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove("show"), 1600);
  }

  /* ── Events ── */
  $("submit").addEventListener("click", submit);
  $("shuffle").addEventListener("click", () => {
    const solvedWords = new Set(state.solved.flatMap((gi) => state.puzzle.groups[gi].words));
    const remaining = state.order.filter((w) => !solvedWords.has(w));
    const shuffled = shuffleArr(remaining);
    let k = 0;
    state.order = state.order.map((w) => (solvedWords.has(w) ? w : shuffled[k++]));
    render();
  });
  $("deselect").addEventListener("click", () => {
    state.selected = [];
    render();
  });
  $("share").addEventListener("click", openCam);
  $("copy-text").addEventListener("click", shareText);
  $("cam-shutter").addEventListener("click", capture);
  $("cam-close").addEventListener("click", closeCam);
  $("cam-share-img").addEventListener("click", shareImage);
  $("cam-preview-close").addEventListener("click", closePreview);

  initState();
  </script>
</body>
</html>
